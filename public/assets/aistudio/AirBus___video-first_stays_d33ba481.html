<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirBus — video-first stays</title>
<style>
:root{--bg:#fbfbf8;--card:#fff;--ink:#0a0a0a;--mut:#6b6b6b;--line:#e6e6e1;--red:#e4002b;--soft:#fbeeee;--water:#dbeaf3;--land:#eef0e4;--grad:linear-gradient(90deg,#8b5cf6,#f43f5e);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1c1c1c;--ink:#f4f4f2;--mut:#a0a0a0;--line:#2e2e2e;--soft:#331219;--water:#1b2a35;--land:#242620;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--red)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.logo{background:var(--red);color:#fff;font-weight:800;letter-spacing:-.5px;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:15px}
.pill{border:0;border-radius:99px;padding:7px 14px;font-weight:700;font-size:12px;color:#fff;background:var(--red);cursor:pointer}.pill.dk{background:#0a0a0a}
.search{margin:0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 4px 4px 14px;background:var(--card);box-shadow:0 2px 8px #0001}
.search input{border:0;background:none;outline:0;width:150px;font-size:13px}.search input[type=number]{width:44px}
.go{border:0;background:var(--grad);color:#fff;border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer}
.nav{display:flex;gap:10px;align-items:center;margin-left:auto}.nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:13px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:16px}
.split{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:16px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}.search{order:3;width:100%;margin:0}.search input{flex:1}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.th{position:relative;aspect-ratio:16/10;display:grid;place-items:center;color:#fff;cursor:pointer}
.th .pl{width:44px;height:44px;border-radius:50%;background:#0009;display:grid;place-items:center;font-size:16px}
.th .pr{position:absolute;right:8px;bottom:6px;font-weight:800;text-shadow:0 1px 4px #000a}.th small{font-weight:500;opacity:.9}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:4px}.tag{background:#fbbf24;color:#111;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:800}.tag.g{background:#0009;color:#fff}
.cb{padding:10px}.cb h3{margin:0 0 2px;font-size:13px;line-height:1.25}.mut{color:var(--mut);font-size:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.b{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 8px;font-size:11px;cursor:pointer;font-weight:600}.b.r{background:var(--red);border-color:var(--red);color:#fff}.b.big{padding:10px 16px;font-size:13px}.b.gr{background:var(--grad);border:0;color:#fff}.b:disabled{opacity:.45;cursor:not-allowed}
.map{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));height:calc(100vh - 100px);min-height:380px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--water)}
@media(max-width:860px){.map{position:static;height:320px}}
.map svg{width:100%;height:100%;display:block}.pin{cursor:pointer}.pin text{font-size:11px;font-weight:800;fill:#111}.pin rect{fill:#fff;stroke:#bbb}.pin.on rect{fill:var(--red);stroke:var(--red)}.pin.on text{fill:#fff}
.narrow{max-width:760px;margin:0 auto}.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.warn{background:var(--soft);border:1px solid #f4a3b1;border-radius:14px;padding:14px;margin-bottom:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px}.steps div{font-size:11px;color:var(--mut);border-top:4px solid var(--line);padding-top:4px}.steps .d{border-color:var(--red)}.steps .c{color:var(--ink);font-weight:700}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;outline:0}.in:focus{border-color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.two{grid-template-columns:1fr}}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:8px;background:var(--card);font-size:13px}.chip.on{background:var(--soft);border-color:var(--red)}
.chip input{accent-color:var(--red)}.gh{font-size:11px;font-weight:800;color:var(--mut);margin:14px 0 6px;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
pre{background:var(--bg);border-radius:10px;padding:12px;margin:0;font-size:13px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.plan{border:2px solid var(--line);border-radius:14px;padding:16px;background:var(--card)}.plan.on{border-color:var(--red)}.plan b{font-size:20px}
.detail{display:grid;grid-template-columns:1fr 280px;gap:16px}@media(max-width:760px){.detail{grid-template-columns:1fr}}
.vid{aspect-ratio:16/9;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;text-align:center;padding:12px}
.stars{color:#f5b301;letter-spacing:2px;cursor:pointer;font-size:18px}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px}.modal .box{width:min(440px,100%);max-height:80vh;overflow:auto;margin:0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0a0a0a;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;font-size:13px;display:none}
.st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#fde68a;color:#111}.st.ok{background:#bbf7d0}
#who{display:flex;gap:6px;align-items:center}
.auth{position:relative;height:520px;overflow:hidden;background:#0b0b14;color:#fff;border:2px solid #ff2e93;border-radius:8px;box-shadow:0 0 24px #ff2e9399,inset 0 0 24px #ff2e9322}
.auth .bg{position:absolute;inset:0;background:linear-gradient(135deg,#ff2e93,#8b5cf6 60%,#22d3ee);clip-path:polygon(54% 0,100% 0,100% 100%,32% 100%);transition:clip-path .7s ease}
.auth.active .bg{clip-path:polygon(0 0,68% 0,46% 100%,0 100%)}
.auth .p{position:absolute;top:0;height:100%;width:50%;display:flex;flex-direction:column;justify-content:center;padding:0 40px;transition:transform .7s ease,opacity .7s ease,filter .7s ease}
.auth .f1{left:0}.auth .f2{right:0;transform:translateX(120%)}.auth .i1{right:0;text-align:right}.auth .i2{left:0;transform:translateX(-120%)}
.auth .f2,.auth .i2{opacity:0;filter:blur(10px);pointer-events:none}
.auth.active .f1{transform:translateX(-120%);opacity:0;filter:blur(10px);pointer-events:none}
.auth.active .i1{transform:translateX(120%);opacity:0;filter:blur(10px);pointer-events:none}
.auth.active .f2,.auth.active .i2{transform:none;opacity:1;filter:none;pointer-events:auto}
.auth h2{font-size:26px;margin:0 0 8px}.auth .f1 h2,.auth .f2 h2{text-shadow:0 0 12px #ff2e93}
.au{background:none;border:0;border-bottom:2px solid #ffffff66;color:#fff;padding:10px 2px;width:100%;margin:8px 0;outline:0;transition:.3s}.au:focus{border-color:#22d3ee;box-shadow:0 6px 12px -8px #22d3ee}.au::placeholder{color:#aaa}
.neon{border:0;border-radius:99px;padding:11px;width:100%;margin-top:12px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(90deg,#ff2e93,#8b5cf6);box-shadow:0 0 16px #ff2e93aa}
.rp{display:flex;gap:6px;margin:6px 0}.rp button{flex:1;border:1px solid #ffffff55;background:none;color:#fff;border-radius:99px;padding:6px;font-size:12px;cursor:pointer}.rp button.on{background:#ff2e93;border-color:#ff2e93;box-shadow:0 0 10px #ff2e93}
.auth a{color:#22d3ee;cursor:pointer}
@media(max-width:700px){.auth{height:600px}.auth .bg,.auth .i1,.auth .i2{display:none}.auth .p{width:100%;padding:0 24px}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.heart{position:absolute;right:8px;top:8px;border:0;background:#0007;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;z-index:2}.heart.on{color:#ff2e5b}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.fbar .chip{padding:4px 8px;font-size:12px;font-weight:400}.fbar .in{width:auto}
</style></head><body>
<header><span class="logo" onclick="go('home')">AIRBUS</span><button class="pill" onclick="go('home')">▶ Feed</button><button class="pill dk" onclick="go('shorts')">▶ Shorts</button>
<div class="search"><input id="q" list="dl" placeholder="Anywhere" aria-label="Where"><input id="g" type="number" min="1" value="2" aria-label="Guests"><button class="go" onclick="go('home')">Search</button></div>
<div class="nav"><a onclick="go('host')">Become a host</a><a onclick="go('plans')">Plans</a><a onclick="dash()">Dashboard</a><a onclick="go('trip')">✨ Trip finder</a><a onclick="go('inbox')">Inbox<span id="ub"></span></a><a id="adm" onclick="go('admin')" style="display:none">Admin</a><span id="who"></span></div></header>
<main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLANS={Silver:{p:1000,l:3},Diamond:{p:2500,l:10},Gold:{p:5000,l:999}};
const GROUPS={Access:['24/7 Check-in','Elevator','Parking','Self Check-in','Smart Lock'],Bathroom:['Hot Shower','Hair Dryer','Towels Provided','Bathtub'],Comfort:['Air Conditioning','Fan','Queen Bed','King Bed','Mosquito Nets'],Connectivity:['WiFi','Fiber Internet'],Kitchen:['Fridge','Microwave','Coffee Maker','Gas Cooker'],Outdoor:['Balcony','Garden','Swimming Pool','BBQ Grill'],Security:['CCTV','Electric Fence','Gated Community','Perimeter Wall'],Utilities:['Backup Inverter','Borehole','Solar Power','Water Tank']};
const hues=[[262,330],[200,260],[20,350],[150,200],[40,10],[290,220],[170,120],[10,40],[230,300],[330,20]];
const seed=[["Beachfront villa with pool & ocean view","Miami Beach, FL",25.79,-80.13,289,4.8,124,"House",6,3,180,"Middle"],["Cozy condo steps from the boardwalk","Fort Lauderdale, FL",26.12,-80.14,142,4.6,88,"Condo",4,2,95,"Middle"],["Modern downtown loft with skyline views","Tampa, FL",27.95,-82.46,175,4.7,56,"Apartment",3,1,78,"Middle"],["Historic cottage near old town","St. Augustine, FL",29.9,-81.31,198,4.9,201,"House",4,2,110,"Middle"],["Bright bay house with private dock","Key Largo, FL",25.09,-80.45,325,4.8,63,"House",8,4,240,"Middle"],["Surfside studio with rooftop pool","Daytona Beach, FL",29.21,-81.02,119,4.4,40,"Studio",2,1,40,"Middle"],["Sunset bay house with kayaks","Naples, FL",26.14,-81.79,268,4.9,90,"House",6,3,170,"Middle"],["Lakefront retreat with hot tub","Orlando, FL",28.54,-81.38,215,4.7,75,"House",6,3,200,"Middle"],["Pet-friendly bungalow near beach","Pensacola, FL",30.42,-87.22,134,4.5,47,"Bungalow",4,2,90,"Middle"],["Luxury penthouse with panoramic views","Sarasota, FL",27.34,-82.53,412,4.8,69,"Apartment",4,2,160,"Middle"]].map((a,i)=>({id:'s'+(i+1),title:a[0],loc:a[1],lat:a[2],lng:a[3],price:a[4],cur:'USD',rating:a[5],rc:a[6],type:a[7],guests:a[8],beds:a[9],area:a[10],cat:a[11],status:'live',feat:['WiFi','Air Conditioning'],hue:hues[i]}));
let mem=null,DB;
const store={r(){try{return JSON.parse(localStorage.getItem('airbus_db'))}catch(e){return mem}},w(d){mem=d;try{localStorage.setItem('airbus_db',JSON.stringify(d))}catch(e){}}};
DB=store.r()||{stays:seed,plan:null,pending:[],wallet:0,bookings:[],reviews:[],chats:[],offers:[]};
DB.threads=DB.threads||[];DB.audit=DB.audit||[];if(!DB.threads.length){const n=Date.now();DB.threads=[{id:'s1',unread:true,msgs:[{from:'guest',k:'offer',v:260,st:'countered',at:n-9e6},{from:'host',k:'counter',v:275,st:'pending',at:n-6e6}]},{id:'s2',unread:true,msgs:[{from:'host',k:'msg',t:'Hi! Happy to host you. Any questions?',at:n-3e6}]}]}
DB.users=DB.users||[];DB.wish=DB.wish||[];DB.rv=DB.rv||[];
if(DB.v!==2){DB.stays=[['Modern Westlands apartment with city views','Westlands, Nairobi',-1.2676,36.8108,7500,4.8,124,'Apartment',4,2,85,['WiFi','Kitchen','Parking'],'Airbnb',1],['Cozy Kilimani studio near Yaya Centre','Kilimani, Nairobi',-1.2921,36.7872,4500,4.6,88,'Studio',2,1,35,['WiFi','Air Conditioning'],'Booking.com',0],['Lavington garden bungalow','Lavington, Nairobi',-1.2833,36.7667,9800,4.9,201,'Bungalow',5,3,140,['WiFi','Garden','Parking','Kitchen'],'Direct',1],['Nyali beachfront villa with pool','Nyali, Mombasa',-4.0283,39.7167,22000,4.8,63,'Villa',8,4,260,['WiFi','Pool','Air Conditioning','Parking'],'Airbnb',0],['Diani beach cottage steps from the sand','Diani, Kwale',-4.3167,39.5833,12500,4.7,75,'Bungalow',4,2,90,['WiFi','Garden','Kitchen'],'Direct',1],['Karen cottage with fireplace','Karen, Nairobi',-1.3167,36.7,8800,4.7,47,'Bungalow',3,2,100,['WiFi','Garden','Parking'],'Booking.com',0],['Kilimani 2BR with rooftop pool','Kilimani, Nairobi',-1.2896,36.79,11000,4.5,40,'Apartment',4,2,95,['WiFi','Pool','Kitchen','Air Conditioning'],'Airbnb',1],['Naivasha lakeside house','Naivasha, Nakuru',-0.7167,36.4333,15000,4.9,90,'House',6,3,170,['WiFi','Garden','Kitchen','Parking'],'Direct',0]].map((a,i)=>({id:'s'+(i+1),title:a[0],loc:a[1],lat:a[2],lng:a[3],price:a[4],cur:'KES',rating:a[5],rc:a[6],type:a[7],guests:a[8],beds:a[9],area:a[10],feat:a[11],src:a[12],ib:!!a[13],cat:'Silver',status:'live',demo:true,hue:hues[i]}));DB.bookings=[];DB.v=2;store.w(DB)}
/* API layer: swap these functions for fetch() calls to a REST backend */
const api={save(){store.w(DB)},
 live:()=>DB.stays.filter(s=>s.status==='live'),
 get:id=>DB.stays.find(s=>s.id===id),
 activePlan:()=>DB.plan&&DB.plan.status==='active'&&(!DB.plan.end||DB.plan.end>Date.now())?DB.plan:null,
 mine:()=>DB.stays.filter(s=>s.mine),
 submitPayment(kind,amount,code,tier){if(!/^[A-Z0-9]{10}$/.test(code))throw'M-Pesa code must be 10 letters/digits (e.g. QGH7X2K9LM).';if(DB.pending.some(p=>p.code===code))throw'That code was already submitted.';if(+amount<(PLANS[tier]?.p||1))throw'Amount is below the required KES '+PLANS[tier].p+'.';DB.pending.push({id:'p'+Date.now(),kind,amount:+amount,code,tier,at:Date.now()});api.save()},
 approve(id){if(!ADMIN)return;const p=DB.pending.find(x=>x.id===id);if(!p)return;if(p.kind==='plan')DB.plan={tier:p.tier,status:'active',end:Math.max(Date.now(),DB.plan?.end||0)+30*864e5};else DB.wallet+=p.amount;DB.pending=DB.pending.filter(x=>x.id!==id);DB.stays.forEach(s=>{if(s.mine&&s.status==='review'&&api.activePlan())s.status='live'});api.save()},
 create(w){const pl=api.activePlan(),n=api.mine().length;if(!pl)throw'An active plan is required.';if(!RANK[w.cat]||RANK[w.cat]>RANK[pl.tier])throw'Your '+pl.tier+' plan cannot list in the '+w.cat+' category.';if(n>=PLANS[pl.tier].l)throw'Plan listing limit reached.';const s={id:'s'+Date.now(),mine:true,status:'review',rating:0,rc:0,cur:'KES',hue:[Math.random()*360|0,Math.random()*360|0],...w};DB.stays.unshift(s);api.save();return s}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};
const money=s=>CUR+' '+Math.round(Number(s.price)*(RATE[CUR]||1)/(RATE[s.cur]||1)).toLocaleString();
const grad=s=>`linear-gradient(135deg,hsl(${s.hue[0]} 55% 35%),hsl(${s.hue[1]} 60% 22%))`;
function go(h){location.hash=h;if(location.hash.slice(1)===h)route()}
let W,hov=null;
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box">'+html+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
function card(s){return `<div class="card" onmouseenter="pinOn('${s.id}')" onmouseleave="pinOn()"><div class="th" style="background:${grad(s)}" onclick="go('stay-${s.id}')"><div class="tags"><span class="tag">${esc(s.cat.toUpperCase())}</span><span class="tag g">${esc(s.type)}</span>${s.rc?`<span class="tag g">★ ${s.rating} (${s.rc})</span>`:''}</div><div class="pl">▶</div><div class="pr"><small>from</small> ${money(s)}<small>/night</small></div></div><div class="cb"><h3>${esc(s.title)}</h3><div class="mut">📍 ${esc(s.loc)}</div><div class="mut">${s.guests} guests · ${s.beds} beds · ${s.area} m²</div><div class="btns"><button class="b" onclick="avail('${s.id}')">Check availability</button><button class="b r" onclick="book('${s.id}')">Book now</button><button class="b" onclick="chat('${s.id}')">Chat host</button><button class="b r" onclick="nego('${s.id}')">Negotiate</button></div><div style="text-align:right;margin-top:6px"><a class="mut" style="color:var(--red);cursor:pointer" onclick="go('stay-${s.id}')">View deal →</a></div></div></div>`}
function mapSVG(list){if(!list.length)return'<svg></svg>';const la=list.map(s=>s.lat),lo=list.map(s=>s.lng);let a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo);const pad=.6;a-=pad;b+=pad;c-=pad;d+=pad;const W=600,H=600,x=l=>(l-c)/(d-c)*W,y=l=>H-(l-a)/(b-a)*H;let g='';for(let i=1;i<10;i++)g+=`<path d="M${i*60} 0V600M0 ${i*60}H600" stroke="var(--line)" stroke-width=".6" opacity=".6"/>`;
return`<svg viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of stays"><rect width="600" height="600" fill="var(--water)"/><path d="M0 170Q150 120 300 190T600 140V600H0Z" fill="var(--land)"/>${g}${list.map(s=>`<g class="pin" id="pin-${s.id}" onclick="go('stay-${s.id}')" transform="translate(${x(s.lng).toFixed(0)},${y(s.lat).toFixed(0)})"><rect x="-30" y="-12" width="60" height="22" rx="11"/><text text-anchor="middle" y="3">${s.cur==='USD'?'$':'KES '}${s.price}</text></g>`).join('')}</svg>`}
function pinOn(id){document.querySelectorAll('.pin.on').forEach(p=>p.classList.remove('on'));if(id){const p=$('#pin-'+id);if(p){p.classList.add('on');p.parentNode.appendChild(p)}}}
function home(){const q=$('#q').value.toLowerCase(),g=+$('#g').value||1;const l=api.live().filter(s=>(s.title+s.loc).toLowerCase().includes(q)&&s.guests>=g);
$('#app').innerHTML=`<div class="split"><div><div class="mut" style="margin-bottom:8px">${l.length} stays</div><div class="grid">${l.map(card).join('')||'<p class="mut">No stays match your search.</p>'}</div></div><div class="map">${mapSVG(l)}</div></div>`}
